<!DOCTYPE html>

<style>
:root {
  --ink:#1a1f2e; --ink-mid:#3d4a5c; --ink-soft:#6b7a8d;
  --border:#d0d9e4; --bg:#f4f7fb; --surface:#fff;
  --green:#1d5c3a; --green-l:#e8f4ed; --green-d:#165030;
  --saffron:#e8750a; --saffron-l:#fef3e8; --saffron-d:#c4610a;
  --sky:#1e6fa8; --sky-l:#e8f3fb;

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
.hdr{background:linear-gradient(135deg,var(--green),#2a7a4f);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.2);}
.hdr-brand{display:flex;align-items:center;gap:10px;}
.hdr-brand h1{font-size:15px;font-weight:700;}
.hdr-brand p{font-size:10px;opacity:.7;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.user-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
.btn-logout:hover{background:rgba(255,255,255,.25);}
.layout{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.sec-label{padding:6px 16px 3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin-top:6px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;font-size:13px;color:var(--ink-mid);}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--green-l);border-left-color:var(--green);color:var(--green);font-weight:600;}
.main{flex:1;padding:22px;overflow-x:hidden;}
.pg-title{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.pg-title h2{font-size:19px;font-weight:700;}
.pg-title p{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.card-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--ink);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.stat.total::before{background:var(--saffron);}
.stat.sent::before{background:var(--sky);}
.stat.sq::before{background:var(--green);}
.stat.nsq::before{background:var(--red);}
.stat.pending::before{background:var(--gold);}
.stat-label{font-size:10px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.stat-val{font-size:26px;font-weight:800;line-height:1.1;margin-top:3px;}
.stat.total .stat-val{color:var(--saffron);}
.stat.sent .stat-val{color:var(--sky);}
.stat.sq .stat-val{color:var(--green);}
.stat.nsq .stat-val{color:var(--red);}
.stat.pending .stat-val{color:var(--gold);}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-green{background:var(--green);color:#fff;}

.btn-saffron{background:var(--saffron);color:#fff;}

.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{filter:brightness(1.1);}
.btn-sky{background:var(--sky);color:#fff;}
.btn-sky:hover{filter:brightness(1.1);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}

.nowrap{white-space:nowrap;}
.wrap{white-space:normal;max-width:180px;}

.b-sq{background:var(--green-l);color:var(--green);}
.b-nsq{background:var(--red-l);color:var(--red);}

.b-pending{background:var(--gold-l);color:var(--gold);}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;}
.di label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}

.usermenu-item{display:block;width:100%;padding:10px 14px;text-align:left;border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}

async function sbFetch(path, opts={}) {
  const r = await fetch(SUPA_URL + path, {
    ...opts,
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "",
      ...(opts.headers||{})
    }
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(err);
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : {};
}

async function sbSelect(table, params="") {
  return sbFetch(`/rest/v1/${table}?${params}`);
}
async function sbInsert(table, data) {
  return sbFetch(`/rest/v1/${table}`, {
    method:"POST", prefer:"return=representation",
    body: JSON.stringify(data)
  });
}
async function sbUpdate(table, match, data) {
  return sbFetch(`/rest/v1/${table}?${match}`, {
    method:"PATCH", prefer:"return=representation",
    body: JSON.stringify(data)
  });

// ── Constants ─────────────────────────────────────────────────────────────────
const DISTRICTS=['Dehradun','Haridwar','Uttarkashi','Tehri','Pauri','Rudraprayag',
  'Chamoli','Bageshwar','Almora','Pithoragarh','Champawat','Nainital','Udham Singh Nagar'];

  'Haridwar':'HDR',       // Haridwar
  'Uttarkashi':'UKI',     // Uttarkashi
  'Tehri':'THR',          // Tehri Garhwal

const LABS=[
  'State Ayurvedic Drug Testing Laboratory, Haridwar',
  'M/s Devansh Testing & Research Laboratory Ltd., Lakeshwari, Roorkee Haridwar.',

// Inspector filter — built dynamically from loaded samples

  const names=new Set(S.samples.map(x=>x.inspector).filter(Boolean));

// ── State ─────────────────────────────────────────────────────────────────────
let S = {
  user: null, page: 'dashboard',
  samples: [], samplesLoaded: false,

// ── Helpers ───────────────────────────────────────────────────────────────────
function today(){ return new Date().toISOString().split('T')[0]; }
function g(id){ return (document.getElementById(id)||{}).value||''; }

  const m={Sent:'b-sent',Reported:'b-sq',Draft:'b-draft'};

function findingBadge(f){
  if(!f||f==='Pending') return `<span class="badge b-pending">Pending</span>`;
  if(f==='Standard Quality') return `<span class="badge b-sq">✅ Standard</span>`;

function canManage(s){
  const r=S.user.role;
  if(r==='admin') return true;
  // ADC: sees all samples but can only manage entries they personally recorded
  if(r==='adc') return s.inspector===S.user.name;
  // DI: only own district
  return r==='di' && s.district===S.user.district;
}
// Calculate current financial year from date
function getCurrentFY(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth(); // 0=Jan
  // FY starts April 1. If month < 3 (Jan/Feb/Mar) it's previous FY
  const fyStart = m<3 ? y-1 : y;
  const fyEnd = fyStart+1;
  return `${fyStart}-${String(fyEnd).slice(-2)}`;
}

async function genSerialAsync(){
  // Serial is based on the LOGGED-IN USER only — not collection district
  // ADC → ADC-UK-XXXX/FY
  // DI  → DI-{DISTCODE}-XXXX/FY  (based on their registered district)
  const role = S.user.role;
  const fy = getCurrentFY();
  let pfx;
  if(role === 'adc' || role === 'admin'){
    pfx = 'ADC-UK';
  } else {
    // DI's own district code
    const distCode = DIST_CODE[S.user.district] || 'UK';
    pfx = `DI-${distCode}`;
  }
  try{
    // Query Supabase for highest serial number with this prefix in this FY
    const encoded = encodeURIComponent(pfx + '-');
    const rows = await sbSelect('samples',
      `regulatory_serial=like.${encoded}%25&financial_year=eq.${encodeURIComponent(fy)}&select=regulatory_serial&order=regulatory_serial.desc&limit=50`
    );
    let nextNum = 1;
    if(rows && rows.length > 0){
      // Find max number from matching serials
      let maxNum = 0;
      rows.forEach(r => {
        const m = String(r.regulatory_serial).match(/-(\d{4})\//);
        if(m){
          const n = parseInt(m[1]);
          if(n > maxNum) maxNum = n;
        }
      });
      nextNum = maxNum + 1;
    }
    return `${pfx}-${String(nextNum).padStart(4,'0')}/${fy}`;
  }catch(e){
    console.warn('Serial gen fallback:', e.message);
    // Fallback: count from loaded samples
    const n = S.samples.filter(x =>
      x.regulatory_serial && x.regulatory_serial.startsWith(pfx) && x.financial_year === fy
    ).length + 1;
    return `${pfx}-${String(n).padStart(4,'0')}/${fy}`;
  }
}

function filteredSamples(){

  const r=S.user.role;
  if(r==='di') s=s.filter(x=>x.district===S.user.district);
  if(S.fDI && (r==='adc'||r==='admin')) s=s.filter(x=>x.inspector===S.fDI);
  if(S.fFY) s=s.filter(x=>x.financial_year===S.fFY);
  if(S.fSearch){
    const q=S.fSearch.toLowerCase();
    s=s.filter(x=>
      (x.sample_name||'').toLowerCase().includes(q)||
      (x.regulatory_serial||'').toLowerCase().includes(q)||
      (x.manufacturer_name||'').toLowerCase().includes(q)||
      (x.batch_number||'').toLowerCase().includes(q)||
      (x.lot_number||'').toLowerCase().includes(q)
    );
  }
  if(S.fTab==='sent')     s=s.filter(x=>x.workflow_status==='Sent');
  if(S.fTab==='reported') s=s.filter(x=>x.workflow_status==='Reported');
  if(S.fTab==='sq')  s=s.filter(x=>x.analytical_finding==='Standard Quality');
  if(S.fTab==='nsq') s=s.filter(x=>x.analytical_finding==='Not of Standard Quality');
  const col=S.sortCol, dir=S.sortDir;
  s.sort((a,b)=>{
    const av=String(a[col]||'').toLowerCase(), bv=String(b[col]||'').toLowerCase();
    return av<bv?-dir:av>bv?dir:0;
  });
  return s;
}

function bindLogin(){
  document.getElementById('lbtn').onclick=doLogin;
  document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')doLogin();};
  const pb=document.getElementById('btn-public');
  if(pb) pb.onclick=()=>{S.page='public';render();};
  const fp=document.getElementById('btn-forgotpwd');
  if(fp) fp.onclick=()=>{S.modal='forgotpwd';render();};
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  if(!u||!p){S.loginErr='Please enter username and password.';render();bindLogin();return;}
  loader(true);
  try{
    const rows=await sbSelect('users',`username=eq.${encodeURIComponent(u)}&select=*`);
    if(!rows||rows.length===0){S.loginErr='Username not found.';loader(false);render();bindLogin();return;}
    const usr=rows[0];
    if(usr.password!==p){S.loginErr='Password galat hai.';loader(false);render();bindLogin();return;}
    S.user=usr;
    S.loginErr=null;
    await loadSamples();
    loader(false);
    // First login check — prompt for email/mobile if not set
    if(!usr.email || !usr.mobile){
      S.modal='firstlogin';
    }
    render();
  }catch(e){
    S.loginErr='Server error: '+e.message;
    loader(false);render();bindLogin();
  }
}

}

function renderReports(){
  const s=S.samples;
  const nsq=s.filter(x=>x.analytical_finding==='Not of Standard Quality');
  const byDist={};DISTRICTS.forEach(d=>{byDist[d]=s.filter(x=>x.district===d).length;});
  const byFY={};FYS.forEach(y=>{byFY[y]=s.filter(x=>x.financial_year===y).length;});
  return `<div class="pg-title"><div><h2>Reports & Analytics</h2></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
    <div class="card"><div class="card-title">📅 By Financial Year</div>
      ${FYS.map(y=>{const c=byFY[y]||0,mx=Math.max(...Object.values(byFY),1);
        return `<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${y}</span><strong>${c}</strong></div>
        <div style="background:var(--border);border-radius:3px;height:7px;"><div style="background:var(--saffron);width:${Math.round(c/mx*100)}%;height:100%;border-radius:3px;"></div></div></div>`;
      }).join('')}

    <div class="card"><div class="card-title">📍 By District</div>
      ${DISTRICTS.map(d=>{const c=byDist[d]||0,mx=Math.max(...Object.values(byDist),1);
        return `<div style="margin-bottom:7px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;"><span>${d}</span><strong>${c}</strong></div>
        <div style="background:var(--border);border-radius:3px;height:5px;"><div style="background:var(--green);width:${Math.round(c/mx*100)}%;height:100%;border-radius:3px;"></div></div></div>`;
      }).join('')}
    </div>
  </div>
  <div class="card"><div class="card-title" style="color:var(--red);">⚠️ Not of Standard Quality — ${nsq.length} samples</div>
    ${nsq.length===0?'<div class="empty"><span class="eicon">✅</span>No NSQ samples</div>':`
    <div class="tbl-wrap"><table>
      <thead><tr><th>Serial</th><th>Drug</th><th>Type</th><th>Manufacturer</th><th>Batch/Lot</th><th>District</th><th>FY</th><th>Reported</th></tr></thead>
      <tbody>${nsq.map(x=>`<tr>

        <td><span class="type-pill ${x.sample_type==='Raw Drug'?'tp-raw':'tp-med'}">${x.sample_type==='Raw Drug'?'🌿 Raw':'💊 Med'}</span></td>
        <td style="font-size:11px;">${x.manufacturer_name}</td>
        <td style="font-family:monospace;">${x.sample_type==='Raw Drug'?(x.lot_number||'—'):(x.batch_number||'—')}</td>
        <td>${x.district}</td><td>${x.financial_year}</td><td>${x.lab_date_reported}</td>
      </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>`;
}

function bindFormConditional(pfx){
  const st=document.getElementById(`${pfx}_stype`);
  if(!st) return;
  // Sample name sync
  const sn=document.getElementById(`${pfx}_sname`);
  const mn=document.getElementById(`${pfx}_mname`);
  if(sn&&mn) sn.addEventListener('input',()=>{mn.value=sn.value;});
  // Sample type → show/hide fields
  function toggleType(){
    const isMed=st.value==='Medicine';
    ['cat','batch','mfgdate','exp'].forEach(r=>{const el=document.getElementById(`${pfx}_${r}_row`);if(el)el.style.display=isMed?'':'none';});
    ['lot','coldate'].forEach(r=>{const el=document.getElementById(`${pfx}_${r}_row`);if(el)el.style.display=isMed?'none':'';});
  }
  st.addEventListener('change',toggleType);
  // Collection source → show Order No/Date only for Govt Supply
  const csrc=document.getElementById(`${pfx}_csrc`);
  function toggleOrder(){
    const isGovt=csrc&&csrc.value==='Govt Supply';
    ['ordnum','orddate'].forEach(r=>{
      const el=document.getElementById(`${pfx}_${r}_row`);
      if(el) el.style.display=isGovt?'':'none';
    });
  }
  if(csrc){csrc.addEventListener('change',toggleOrder);toggleOrder();}
  // Serial is fixed per logged-in user — no listener needed
}


function collectForm(pfx){
  const fy=g(`${pfx}_fy`)||getCurrentFY(), dist=g(`${pfx}_dist`);
  const stype=g(`${pfx}_stype`), isMed=stype==='Medicine';
  const sname=g(`${pfx}_sname`);
  const serial=g(`${pfx}_serial`);
  return {
    regulatory_serial:serial, financial_year:fy, district:dist, sample_name:sname, medicine_name:sname,
    sample_type:stype, sample_category:isMed?g(`${pfx}_scat`):'',
    enrolment_protocol:g(`${pfx}_ep`), inspector:g(`${pfx}_insp`)||S.user.name,
    date_of_sampling:g(`${pfx}_dos`), collection_source:g(`${pfx}_csrc`),
    collection_details:g(`${pfx}_cdet`), manufacturer_name:g(`${pfx}_mfgname`),
    license_number:g(`${pfx}_lic`)||'N/A',
    batch_number:isMed?g(`${pfx}_batch`):'', lot_number:!isMed?g(`${pfx}_lot`):'',
    mfg_date:isMed?g(`${pfx}_mfgdate`):'', expiry_date:isMed?g(`${pfx}_exp`):'',
    collection_date:!isMed?g(`${pfx}_coldate`):'',
    unit_quantity:g(`${pfx}_uqty`), dosage_form:g(`${pfx}_dosf`),
    order_number:g(`${pfx}_ordnum`)||'N/A', order_date:g(`${pfx}_orddate`)||'N/A',
    inspector_suspicion:g(`${pfx}_susp`), target_laboratory:g(`${pfx}_lab`),
    name_disclosed:g(`${pfx}_namedis`)||'N/A', sample_owner:g(`${pfx}_owner`),
  };
}

// ── INSPECTOR SUMMARY (Public) ────────────────────────────────────────────────
function renderInspectorSummary(){
  const all = S.samples.filter(x=>x.workflow_status==='Reported'||x.analytical_finding==='Standard Quality'||x.analytical_finding==='Not of Standard Quality');
  // Get unique inspectors
  const inspectors = [...new Set(all.map(x=>x.inspector).filter(Boolean))].sort();
  if(inspectors.length===0) return '<div class="empty"><span class="eicon">👤</span>No data available</div>';

  // Build data: inspector → FY → {total, sq, nsq}
  const data={};
  inspectors.forEach(insp=>{
    data[insp]={};
    FYS.forEach(fy=>{
      const s=all.filter(x=>x.inspector===insp&&x.financial_year===fy);
      if(s.length>0){
        data[insp][fy]={
          total:s.length,
          sq:s.filter(x=>x.analytical_finding==='Standard Quality').length,
          nsq:s.filter(x=>x.analytical_finding==='Not of Standard Quality').length,
          pending:s.filter(x=>x.analytical_finding==='Pending'||!x.analytical_finding).length,
        };
      }
    });

  // FYs that have data
  const activeFYs = FYS.filter(fy=>inspectors.some(insp=>data[insp][fy]));

// ── CSV DOWNLOAD ──────────────────────────────────────────────────────────────
function downloadCSV(){
  const list=filteredSamples();
  const HEADERS=['Regulatory Serial','Financial Year','Drug/Sample Name','Sample Type',
    'Sample Category','Enrolment Protocol','Inspector','District','Date of Sampling',
    'Collection Source','Collection Details','Manufacturer Name','License Number',
    'Batch Number','Lot Number','Mfg. Date','Expiry Date','Purchase/Collection Date',
    'Unit Quantity','Dosage Form','Order Number','Order Date','Inspector Suspicion',
    'Target Laboratory','Workflow Status','Lab Date Received','Lab Date Reported',
    'Analytical Finding','Name Disclosed 33KA','Sample Owner'];
  const FIELDS=['regulatory_serial','financial_year','sample_name','sample_type',
    'sample_category','enrolment_protocol','inspector','district','date_of_sampling',
    'collection_source','collection_details','manufacturer_name','license_number',
    'batch_number','lot_number','mfg_date','expiry_date','collection_date',
    'unit_quantity','dosage_form','order_number','order_date','inspector_suspicion',
    'target_laboratory','workflow_status','lab_date_received','lab_date_reported',
    'analytical_finding','name_disclosed','sample_owner'];
  const esc=v=>{const s=String(v==null?'':v).replace(/"/g,'""');return (s.includes(',')||s.includes('"')||s.includes('\n'))?`"${s}"`:s;};
  const rows=[HEADERS.map(esc).join(',')];
  list.forEach(x=>rows.push(FIELDS.map(f=>esc(x[f]||'')).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const ts=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const tab={all:'All',sent:'Sent',reported:'Reported',sq:'SQ',nsq:'NSQ'}[S.fTab]||'All';
  a.download=`DrugSamples_${tab}_${ts}.csv`;a.click();URL.revokeObjectURL(url);
}

// ── BIND ALL ──────────────────────────────────────────────────────────────────
function bindAll(){
  // Logout
  const lo=document.getElementById('logout');
  if(lo) lo.onclick=()=>{S.user=null;S.page='dashboard';S.samples=[];S.samplesLoaded=false;render();};
  // User menu
  const umBtn=document.getElementById('usermenu-btn');
  const umDrop=document.getElementById('usermenu-drop');
  if(umBtn&&umDrop){
    umBtn.onclick=e=>{e.stopPropagation();umDrop.style.display=umDrop.style.display==='none'?'block':'none';};
    document.addEventListener('click',()=>{if(umDrop)umDrop.style.display='none';});
  }
  // Nav
  document.querySelectorAll('[data-pg]').forEach(el=>el.onclick=()=>{S.page=el.dataset.pg;render();});
  document.querySelectorAll('[data-act="new"]').forEach(el=>el.onclick=()=>{S.page='new';render();});
  // Tabs
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{S.fTab=el.dataset.tab;render();});
  // Filters
  const fs=document.getElementById('fsrch');if(fs)fs.oninput=e=>{S.fSearch=e.target.value;render();};
  const fdi=document.getElementById('fdi');if(fdi)fdi.onchange=e=>{S.fDI=e.target.value;render();};
  const ff=document.getElementById('ffy');if(ff)ff.onchange=e=>{S.fFY=e.target.value;render();};
  const fc=document.getElementById('fclr');if(fc)fc.onclick=()=>{S.fSearch='';S.fDI='';S.fFY='';S.fTab='all';render();};
  // Sort
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick=()=>{const col=th.dataset.sort;S.sortCol===col?S.sortDir*=-1:(S.sortCol=col,S.sortDir=-1);render();};
  });
  // CSV
  const csvBtn=document.getElementById('btn-csv');if(csvBtn)csvBtn.onclick=downloadCSV;
  // Alert
  const ac=document.getElementById('acl');if(ac){ac.onclick=()=>{S.alert=null;render();};setTimeout(()=>{if(S.alert){S.alert=null;render();}},4000);}
  // Dashboard rows
  document.querySelectorAll('tr.sr').forEach(row=>row.onclick=e=>{
    if(e.target.tagName==='BUTTON') return;
    const s=S.samples.find(x=>x.id===row.dataset.id);

  });
  // Table buttons
  document.querySelectorAll('.action-open').forEach(btn=>btn.onclick=()=>{S.activeSample=S.samples.find(x=>x.id===btn.dataset.id);S.modal='action';render();});
  document.querySelectorAll('.view-btn').forEach(btn=>btn.onclick=()=>{S.activeSample=S.samples.find(x=>x.id===btn.dataset.id);S.modal='view';render();});
  // Modal close
  const cm=()=>{S.modal=null;S.activeSample=null;render();};
  document.querySelectorAll('#mcl,#mcl2').forEach(b=>{if(b)b.onclick=cm;});
  const ov=document.getElementById('ov');if(ov)ov.onclick=e=>{if(e.target===ov)cm();};
  // Action choices
  const ge=document.getElementById('go-edit');if(ge)ge.onclick=()=>{S.modal='edit';render();};
  const gr=document.getElementById('go-report');if(gr)gr.onclick=()=>{if(S.activeSample.workflow_status==='Sent'){S.modal='report';render();}};
  const gv=document.getElementById('go-view');if(gv)gv.onclick=()=>{S.modal='view';render();};
  // Form conditionals
  bindFormConditional('np');bindFormConditional('em');
  // Auto-generate serial for new entry — based on logged-in user only
  if(S.page==='new'){
    const serialEl=document.getElementById('np_serial');

    }

  if(emSerial&&emSerial.value) emSerial.dataset.locked='1';

  if(npSend)npSend.onclick=saveNewSample;
  const npCancel=document.getElementById('np-cancel');
  if(npCancel)npCancel.onclick=()=>{S.page='samples';render();};
  // Edit save
  const emSave=document.getElementById('em-save');if(emSave)emSave.onclick=saveEditSample;
  // Report
  const rf=document.getElementById('rpt_finding');if(rf)rf.onchange=()=>{const n=document.getElementById('rpt_nsq_notice');if(n)n.style.display=rf.value==='Not of Standard Quality'?'block':'none';};
  const rptSave=document.getElementById('rpt-save');if(rptSave)rptSave.onclick=saveReport;
  // Password change
  const cpSave=document.getElementById('cp_save');if(cpSave)cpSave.onclick=savePassword;
  // Profile save
  const epSave=document.getElementById('ep_save');if(epSave)epSave.onclick=saveProfile;
  // First login modal
  const flSave=document.getElementById('fl_save');if(flSave)flSave.onclick=saveFirstLogin;
  const flSkip=document.getElementById('fl_skip');if(flSkip)flSkip.onclick=()=>{S.modal=null;render();};
  const flPwd=document.getElementById('fl_newpwd');
  if(flPwd) flPwd.oninput=()=>{
    const row=document.getElementById('fl_confirmpwd_row');
    if(row) row.style.display=flPwd.value.length>0?'':'none';
  };
  // Forgot password
  const fpSend=document.getElementById('fp_send');if(fpSend)fpSend.onclick=doForgotPassword;
  // Admin panel
  const btnAddUser=document.getElementById('btn-add-user');
  if(btnAddUser) btnAddUser.onclick=()=>{S.modal='adduser';render();};
  const auSave=document.getElementById('au_save');
  if(auSave) auSave.onclick=saveNewUser;
  const arSave=document.getElementById('ar_save');
  if(arSave) arSave.onclick=saveAdminResetPwd;
  // Load users when on admin page
  if(S.page==='admin') loadAdminUsers();
}

function bindPublic(){
  // Show login modal
  const lb=document.getElementById('pub-login-btn');
  const modal=document.getElementById('pub-login-modal');
  const closeBtn=document.getElementById('pub-modal-close');
  if(lb&&modal){
    lb.onclick=()=>{modal.style.display='flex';setTimeout(()=>{const el=document.getElementById('pub_lu');if(el)el.focus();},100);};
    closeBtn.onclick=()=>{modal.style.display='none';document.getElementById('pub-login-err').style.display='none';};
    modal.onclick=e=>{if(e.target===modal){modal.style.display='none';}};
  }
  // Login submit
  const sub=document.getElementById('pub-login-submit');
  if(sub){
    sub.onclick=doPubLogin;
    const lp=document.getElementById('pub_lp');
    if(lp) lp.onkeydown=e=>{if(e.key==='Enter')doPubLogin();};
  }
  const pubFp=document.getElementById('pub-forgotpwd');
  if(pubFp) pubFp.onclick=()=>{
    const modal=document.getElementById('pub-login-modal');
    if(modal) modal.style.display='none';
    S.modal='forgotpwd';render();
  };
  // Filters
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{S.fTab=el.dataset.tab;render();});
  const fs=document.getElementById('fsrch');if(fs)fs.oninput=e=>{S.fSearch=e.target.value;render();};
  const ff=document.getElementById('ffy');if(ff)ff.onchange=e=>{S.fFY=e.target.value;render();};
  const fc=document.getElementById('fclr');if(fc)fc.onclick=()=>{S.fSearch='';S.fFY='';S.fTab='all';render();};
}

async function doPubLogin(){
  const u=document.getElementById('pub_lu').value.trim();
  const p=document.getElementById('pub_lp').value;
  const errEl=document.getElementById('pub-login-err');
  errEl.style.display='none';
  if(!u||!p){errEl.style.display='block';errEl.textContent='Please enter username and password.';return;}
  const sub=document.getElementById('pub-login-submit');
  sub.textContent='Logging in...';sub.disabled=true;
  try{
    const rows=await sbSelect('users',`username=eq.${encodeURIComponent(u)}&select=*`);
    if(!rows||rows.length===0){errEl.style.display='block';errEl.textContent='Username not found.';sub.textContent='Login →';sub.disabled=false;return;}
    const usr=rows[0];
    if(usr.password!==p){errEl.style.display='block';errEl.textContent='Password galat hai.';sub.textContent='Login →';sub.disabled=false;return;}
    S.user=usr;S.loginErr=null;
    if(!S.samplesLoaded){
      const srows=await sbSelect('samples','select=*&order=date_of_sampling.desc,created_at.desc&limit=2000');
      S.samples=srows||[];S.samplesLoaded=true;
    }
    S.page='dashboard';
    // First login check — prompt for email/mobile if not set
    if(!usr.email || !usr.mobile){
      S.modal='firstlogin';
    }
    render();
  }catch(e){
    errEl.style.display='block';errEl.textContent='Server error: '+e.message;
    sub.textContent='Login →';sub.disabled=false;
  }
}

// ── FIRST LOGIN SAVE ──────────────────────────────────────────────────────────
async function saveFirstLogin(){
  const email=(document.getElementById('fl_email')||{}).value||'';
  const mobile=(document.getElementById('fl_mobile')||{}).value||'';
  const newpwd=(document.getElementById('fl_newpwd')||{}).value||'';
  const confirmpwd=(document.getElementById('fl_confirmpwd')||{}).value||'';
  const errEl=document.getElementById('fl_err');
  errEl.style.display='none';
  const showErr=msg=>{errEl.style.display='block';errEl.textContent=msg;};
  if(!email){showErr('Email address is required.');return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){showErr('Please enter a valid email address.');return;}
  if(!mobile){showErr('Mobile number is required.');return;}
  if(!/^[0-9]{10}$/.test(mobile)){showErr('Mobile number must be 10 digits.');return;}
  if(newpwd && newpwd.length<6){showErr('New password must be at least 6 characters.');return;}
  if(newpwd && newpwd!==confirmpwd){showErr('Passwords do not match.');return;}
  loader(true);
  try{
    const updateData={email:email.trim(),mobile:mobile.trim()};
    if(newpwd) updateData.password=newpwd;
    await sbUpdate('users',`id=eq.${S.user.id}`,updateData);
    S.user={...S.user,...updateData};
    S.modal=null;
    S.alert={type:'ok',msg:'✅ Profile setup complete. Welcome, '+S.user.name+'!'};
  }catch(e){
    errEl.style.display='block';errEl.textContent='Save failed: '+e.message;
  }
  loader(false);render();
}

// ── FORGOT PASSWORD ───────────────────────────────────────────────────────────
async function doForgotPassword(){
  const email=(document.getElementById('fp_email')||{}).value||'';
  const msgEl=document.getElementById('fp_msg');
  const btn=document.getElementById('fp_send');
  msgEl.style.display='none';
  const showMsg=(msg,ok)=>{
    msgEl.style.display='block';
    msgEl.style.background=ok?'var(--green-l)':'var(--red-l)';
    msgEl.style.color=ok?'var(--green)':'var(--red)';
    msgEl.style.border=ok?'1px solid #aed9c0':'1px solid #f5b7b1';
    msgEl.textContent=msg;
  };
  if(!email){showMsg('Please enter your registered email address.',false);return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){showMsg('Please enter a valid email address.',false);return;}
  btn.textContent='Sending...';btn.disabled=true;
  try{
    // Find user by email
    const rows=await sbSelect('users',`email=eq.${encodeURIComponent(email)}&select=id,username,name,email`);
    if(!rows||rows.length===0){
      showMsg('No account found with this email address.',false);
      btn.textContent='📧 Send New Password';btn.disabled=false;return;
    }
    const usr=rows[0];
    const newPwd=generatePassword();
    // Update password in DB
    await sbUpdate('users',`id=eq.${usr.id}`,{password:newPwd});
    // Send email
    const sent=await sendPasswordEmail(email,usr.name||usr.username,newPwd);
    if(sent){
      showMsg('✅ A new password has been sent to '+email+'. Please check your inbox.',true);
      btn.textContent='✅ Sent';
    } else {
      // Email sending failed
      showMsg('Unable to send email. Please contact: drugportal@uttarakhandayurved.co.in',false);
      btn.textContent='📧 Send New Password';btn.disabled=false;
    }
  }catch(e){
    showMsg('Error: '+e.message,false);
    btn.textContent='📧 Send New Password';btn.disabled=false;
  }
}


// ── ADMIN FUNCTIONS ───────────────────────────────────────────────────────────
async function loadAdminUsers(){
  try{
    const users = await sbSelect('users','select=*&order=role.asc,username.asc');
    const list = document.getElementById('admin-users-list');
    if(list) list.innerHTML = renderUserTable(users||[]);
    bindAdminTableEvents();
  }catch(e){
    const list = document.getElementById('admin-users-list');
    if(list) list.innerHTML = `<div style="padding:20px;color:var(--red);">Error loading users: ${e.message}</div>`;
  }
}

function bindAdminTableEvents(){
  // Reset password buttons
  document.querySelectorAll('.admin-reset-pwd').forEach(btn=>{
    btn.onclick=()=>{
      S.targetUser={id:btn.dataset.id, username:btn.dataset.username, name:btn.dataset.name};
      S.modal='resetpwd';render();
    };
  });
  // Delete user buttons
  document.querySelectorAll('.admin-del-user').forEach(btn=>{
    btn.onclick=async()=>{
      const name=btn.dataset.name, uname=btn.dataset.username, id=btn.dataset.id;
      if(!confirm(`Delete account "${uname}" (${name})? This cannot be undone.`)) return;
      loader(true);
      try{
        await sbFetch(`/rest/v1/users?id=eq.${id}`,{method:'DELETE'});
        S.alert={type:'ok',msg:`✅ Account "${uname}" deleted successfully.`};
        S.page='admin'; render();
        await loadAdminUsers();
      }catch(e){S.alert={type:'err',msg:'Delete failed: '+e.message};}
      loader(false);render();
    };
  });
}

async function saveNewUser(){
  const name=g('au_name'), username=g('au_username'), password=g('au_password');
  const role=g('au_role'), district=g('au_district');
  const email=g('au_email'), mobile=g('au_mobile');
  const errEl=document.getElementById('au_err');
  const showErr=msg=>{errEl.style.display='block';errEl.textContent=msg;};
  errEl.style.display='none';
  if(!name){showErr('Full name is required.');return;}
  if(!username){showErr('Username is required.');return;}
  if(!/^[a-z0-9._]+$/.test(username)){showErr('Username can only contain lowercase letters, numbers, dots and underscores.');return;}
  if(!password||password.length<6){showErr('Password must be at least 6 characters.');return;}
  if(mobile&&!/^[0-9]{10}$/.test(mobile)){showErr('Mobile must be 10 digits.');return;}
  loader(true);
  try{
    // Check if username exists
    const exists=await sbSelect('users',`username=eq.${encodeURIComponent(username)}&select=id`);
    if(exists&&exists.length>0){errEl.style.display='block';errEl.textContent='Username already exists. Choose a different username.';loader(false);return;}
    await sbInsert('users',{username,password,name,role,district,email:email||'',mobile:mobile||''});
    S.modal=null;S.targetUser=null;
    S.alert={type:'ok',msg:`✅ Account "${username}" created successfully.`};
    render();
    await loadAdminUsers();
  }catch(e){errEl.style.display='block';errEl.textContent='Create failed: '+e.message;}
  loader(false);render();
}

async function saveAdminResetPwd(){
  const newpwd=g('ar_newpwd'), confirmpwd=g('ar_confirmpwd');
  const errEl=document.getElementById('ar_err');
  const showErr=msg=>{errEl.style.display='block';errEl.textContent=msg;};
  errEl.style.display='none';
  if(!newpwd||newpwd.length<6){showErr('Password must be at least 6 characters.');return;}
  if(newpwd!==confirmpwd){showErr('Passwords do not match.');return;}
  loader(true);
  try{
    await sbUpdate('users',`id=eq.${S.targetUser.id}`,{password:newpwd});
    S.modal=null;S.targetUser=null;
    S.alert={type:'ok',msg:`✅ Password reset successfully for "${S.targetUser?.username||'user'}".`};
  }catch(e){errEl.style.display='block';errEl.textContent='Reset failed: '+e.message;}
  loader(false);render();
  if(S.page==='admin') await loadAdminUsers();
}


// ── SAVE ACTIONS (Supabase) ───────────────────────────────────────────────────
async function saveNewSample(){
  const d=collectForm('np');
  if(!d.sample_name){S.alert={type:'err',msg:'Sample Name is required.'};render();return;}
  if(d.sample_type==='Medicine'&&!d.batch_number){S.alert={type:'err',msg:'Batch Number is required for Medicine type.'};render();return;}
  loader(true);
  try{
    // Use serial from form (already generated) or generate now
    const serial = d.regulatory_serial || await genSerialAsync();
    const newRow={id:'s_'+Date.now(), regulatory_serial:serial,
      workflow_status:'Sent', lab_date_received:'', lab_date_reported:'N/A',
      analytical_finding:'Pending', ...d};
    await sbInsert('samples', newRow);
    S.samples.unshift(newRow);
    S.alert={type:'ok',msg:`✅ Sample "${d.sample_name}" saved. Serial: ${serial}`};
    S.page='samples';
  }catch(e){S.alert={type:'err',msg:'Save failed: '+e.message};}
  loader(false);render();
}

async function saveEditSample(){
  const d=collectForm('em');
  if(!d.sample_name){S.alert={type:'err',msg:'Sample Name is required.'};render();return;}
  loader(true);
  try{
    await sbUpdate('samples',`id=eq.${S.activeSample.id}`,d);
    S.samples=S.samples.map(x=>x.id===S.activeSample.id?{...x,...d}:x);
    S.modal=null;S.activeSample=null;
    S.alert={type:'ok',msg:'✅ Sample details saved successfully.'};
  }catch(e){S.alert={type:'err',msg:'Update failed: '+e.message};}
  loader(false);render();
}

async function saveReport(){
  const recv=g('rpt_recv'), date=g('rpt_date'), finding=g('rpt_finding');
  if(!date||!finding){S.alert={type:'err',msg:'Date and Finding are both required.'};render();return;}
  loader(true);
  try{
    const upd={workflow_status:'Reported',lab_date_received:recv||'',lab_date_reported:date,analytical_finding:finding};
    await sbUpdate('samples',`id=eq.${S.activeSample.id}`,upd);
    S.samples=S.samples.map(x=>x.id===S.activeSample.id?{...x,...upd}:x);
    const nm=S.activeSample.sample_name;S.modal=null;S.activeSample=null;
    S.alert={type:'ok',msg:`✅ Report saved: "${nm}" → ${finding}`};
  }catch(e){S.alert={type:'err',msg:'Save failed: '+e.message};}
  loader(false);render();
}

async function savePassword(){
  const oldp=g('cp_old'),newp=g('cp_new'),conf=g('cp_conf');
  const errEl=document.getElementById('cp_err');
  const showErr=msg=>{errEl.style.display='block';errEl.textContent=msg;};
  errEl.style.display='none';
  if(oldp!==S.user.password){showErr('Current password galat hai.');return;}
  if(newp.length<6){showErr('New password kam se kam 6 characters ka hona chahiye.');return;}
  if(newp!==conf){showErr('New password aur confirm password match nahi kar rahe.');return;}
  loader(true);
  try{
    await sbUpdate('users',`id=eq.${S.user.id}`,{password:newp});
    S.user={...S.user,password:newp};
    S.modal=null;S.alert={type:'ok',msg:'✅ Password changed successfully.'};
  }catch(e){S.alert={type:'err',msg:'Password update failed: '+e.message};}
  loader(false);render();
}

async function saveProfile(){
  const newName=(document.getElementById('ep_name')||{}).value||'';
  const newDist=S.user.role==='di'?((document.getElementById('ep_dist')||{}).value||S.user.district):S.user.district;
  const newEmail=(document.getElementById('ep_email')||{}).value||'';
  const newMobile=(document.getElementById('ep_mobile')||{}).value||'';
  if(!newName.trim()){S.alert={type:'err',msg:'Name cannot be empty.'};render();return;}
  if(newMobile && !/^[0-9]{10}$/.test(newMobile)){S.alert={type:'err',msg:'Mobile number must be 10 digits.'};render();return;}
  loader(true);
  try{
    await sbUpdate('users',`id=eq.${S.user.id}`,{name:newName.trim(),district:newDist,email:newEmail.trim(),mobile:newMobile.trim()});
    S.user={...S.user,name:newName.trim(),district:newDist,email:newEmail.trim(),mobile:newMobile.trim()};
    S.modal=null;S.alert={type:'ok',msg:'✅ Profile updated. Previous sample records remain unchanged.'};
  }catch(e){S.alert={type:'err',msg:'Profile update failed: '+e.message};}
  loader(false);render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  // Always start on public page
  S.page='public';
  try{
    const rows=await sbSelect('samples','select=*&order=date_of_sampling.desc,created_at.desc&limit=2000');
    S.samples=rows||[];
    S.samplesLoaded=true;
  }catch(e){console.log('Init samples load:',e.message);}
  loader(false);
  render();
}

init();
</script>
