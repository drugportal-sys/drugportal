<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drug Sample Registry — Uttarakhand AYUSH</title>
<style>
:root {
  --ink:#1a1f2e; --ink-mid:#3d4a5c; --ink-soft:#6b7a8d;
  --border:#d0d9e4; --bg:#f4f7fb; --surface:#fff;
  --green:#1d5c3a; --green-l:#e8f4ed; --green-d:#165030;
  --saffron:#e8750a; --saffron-l:#fef3e8; --saffron-d:#c4610a;
  --sky:#1e6fa8; --sky-l:#e8f3fb;
  --red:#c0392b; --red-l:#fdf0ef;
  --gold:#b8860b; --gold-l:#fdf8e8;
  --r:8px; --sh:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
.hdr{background:linear-gradient(135deg,var(--green),#2a7a4f);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.2);}
.hdr-brand{display:flex;align-items:center;gap:10px;}
.hdr-brand h1{font-size:15px;font-weight:700;}
.hdr-brand p{font-size:10px;opacity:.7;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.user-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
.btn-logout:hover{background:rgba(255,255,255,.25);}
.layout{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.sec-label{padding:6px 16px 3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin-top:6px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;font-size:13px;color:var(--ink-mid);}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--green-l);border-left-color:var(--green);color:var(--green);font-weight:600;}
.main{flex:1;padding:22px;overflow-x:hidden;}
.pg-title{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.pg-title h2{font-size:19px;font-weight:700;}
.pg-title p{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);padding:18px;margin-bottom:18px;}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--ink);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.stat.total::before{background:var(--saffron);}
.stat.sent::before{background:var(--sky);}
.stat.sq::before{background:var(--green);}
.stat.nsq::before{background:var(--red);}
.stat.pending::before{background:var(--gold);}
.stat-label{font-size:10px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.stat-val{font-size:26px;font-weight:800;line-height:1.1;margin-top:3px;}
.stat.total .stat-val{color:var(--saffron);}
.stat.sent .stat-val{color:var(--sky);}
.stat.sq .stat-val{color:var(--green);}
.stat.nsq .stat-val{color:var(--red);}
.stat.pending .stat-val{color:var(--gold);}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-d);}
.btn-saffron{background:var(--saffron);color:#fff;}
.btn-saffron:hover{background:var(--saffron-d);}
.btn-outline{background:var(--bg);color:var(--ink-mid);border:1px solid var(--border);}
.btn-outline:hover{background:var(--border);}
.btn-sm{padding:5px 10px;font-size:12px;}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
table th{background:var(--ink);color:#fff;padding:9px 11px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
table td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle;}
table tr:hover td{background:var(--bg);}
.nowrap{white-space:nowrap;}
.wrap{white-space:normal;max-width:180px;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-sent{background:var(--sky-l);color:var(--sky);}
.b-sq{background:var(--green-l);color:var(--green);}
.b-nsq{background:var(--red-l);color:var(--red);}
.b-draft{background:#f0f0f0;color:#666;}
.b-pending{background:var(--gold-l);color:var(--gold);}
/* FORM */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:11.5px;font-weight:600;color:var(--ink-mid);}
.fg label .req{color:var(--red);}
input,select,textarea{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;width:100%;transition:border .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,92,58,.1);}
input[readonly]{background:#f4f7fb;color:var(--ink-soft);}
textarea{resize:vertical;min-height:58px;}
.fsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);border-bottom:2px solid var(--green-l);padding-bottom:5px;margin-top:4px;grid-column:1/-1;}
/* conditional row highlight */
.frow-medicine{} 
.frow-raw{}
/* type indicator pill */
.type-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;}
.tp-med{background:var(--sky-l);color:var(--sky);}
.tp-raw{background:#f0f4e8;color:#5a7a1a;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:830px;box-shadow:0 8px 40px rgba(0,0,0,.2);}
.mhdr{background:linear-gradient(135deg,var(--green),#2a7a4f);color:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0;}
.mhdr h3{font-size:16px;font-weight:700;}
.mhdr p{font-size:11px;opacity:.8;margin-top:2px;}
.mclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;}
.mclose:hover{background:rgba(255,255,255,.3);}
.mbody{padding:18px;max-height:75vh;overflow-y:auto;}
.mfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}
/* LOGIN */
.login-wrap{min-height:100vh;background:linear-gradient(135deg,#0f3d2b,#1d5c3a,#2a7a4f);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:16px;padding:34px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{text-align:center;margin-bottom:22px;}
.login-logo .icon{font-size:42px;}
.login-logo h1{font-size:19px;font-weight:800;color:var(--green);margin-top:7px;}
.login-logo p{font-size:11px;color:var(--ink-soft);}
.login-box .fg{margin-bottom:12px;}
.login-err{background:var(--red-l);color:var(--red);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);}
.fbar input,.fbar select{padding:6px 9px;font-size:12px;width:auto;}
.fbar input{min-width:170px;flex:1;}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:0;padding:0 14px;}
.tab{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}
.action-btns{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.action-btn-tile{padding:22px 18px;cursor:pointer;border:none;background:#fff;border-top:1px solid var(--border);transition:background .15s;text-align:left;}
.action-btn-tile:first-child{border-right:1px solid var(--border);}
.action-btn-tile:hover{background:var(--bg);}
.action-btn-tile .abt-icon{font-size:26px;margin-bottom:6px;}
.action-btn-tile h4{font-size:14px;font-weight:700;margin-bottom:3px;}
.action-btn-tile p{font-size:12px;color:var(--ink-soft);}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;}
.di label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}
.di p{font-size:13px;margin-top:2px;word-break:break-word;}
.alert{padding:10px 13px;border-radius:6px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.alert-ok{background:var(--green-l);color:var(--green);border:1px solid #aed9c0;}
.alert-err{background:var(--red-l);color:var(--red);border:1px solid #f5b7b1;}
.empty{text-align:center;padding:44px 20px;color:var(--ink-soft);}
.empty .eicon{font-size:42px;display:block;margin-bottom:10px;}
.serial{font-family:'Courier New',monospace;font-size:12px;font-weight:700;color:var(--green);}
.usermenu-item{display:block;width:100%;padding:10px 14px;text-align:left;border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);}
.usermenu-item:hover{background:var(--bg);}
/* conditional field visibility */
.field-medicine{} 
.field-raw{}
.hidden{display:none!important;}
@media(max-width:720px){.sidebar{display:none;}.main{padding:12px;}.action-btns{grid-template-columns:1fr;}}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:var(--green);font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader" class="loading-overlay"><div class="spinner"></div><p>Loading...</p></div>

<script>
// ═══════════════════════════════════════════════════════
// DRUG PORTAL — Uttarakhand AYUSH Drug Control Section
// Backend: Supabase
// ═══════════════════════════════════════════════════════

const SUPA_URL = "https://oouhewryfezculmfzocu.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vdWhld3J5ZmV6Y3VsbWZ6b2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY1NTgsImV4cCI6MjA5NjY5MjU1OH0.DDhj5jNHSHPy5oBGt53BheJkOhzIimBkP7lkOMb1JUg";

// ── Supabase API helpers ──────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const r = await fetch(SUPA_URL + path, {
    ...opts,
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "",
      ...(opts.headers||{})
    }
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(err);
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : {};
}

async function sbSelect(table, params="") {
  return sbFetch(`/rest/v1/${table}?${params}`);
}
async function sbInsert(table, data) {
  return sbFetch(`/rest/v1/${table}`, {
    method:"POST", prefer:"return=representation",
    body: JSON.stringify(data)
  });
}
async function sbUpdate(table, match, data) {
  return sbFetch(`/rest/v1/${table}?${match}`, {
    method:"PATCH", prefer:"return=representation",
    body: JSON.stringify(data)
  });
}

// ── Constants ─────────────────────────────────────────────────────────────────
const DISTRICTS=['Dehradun','Haridwar','Uttarkashi','Tehri','Pauri','Rudraprayag',
  'Chamoli','Bageshwar','Almora','Pithoragarh','Champawat','Nainital','Udham Singh Nagar'];
const DIST_CODE={Dehradun:'DDN',Haridwar:'HDR',Uttarkashi:'UKI',Tehri:'THR',
  Pauri:'PRG',Rudraprayag:'RPG',Chamoli:'CHL',Bageshwar:'BGS',
  Almora:'ALM',Pithoragarh:'PTG',Champawat:'CPT',Nainital:'NTL','Udham Singh Nagar':'USN'};
const DOSAGE_FORMS=['Syrup','Churna','Tablet','Capsule','Vati','Gutika','Avaleha',
  'Arista','Asava','Taila','Ghrita','Bhasma','Kwath Churna','Arka','Lepa Churna',
  'Rasayan','Khand','Arq','Powder','Other'];
const COL_SOURCES=['Market','Manufacturing Premise','Govt Supply','Complaint location','Random'];
const SUSPICION=['Normal','Misbranded','Adulterated','Spurious','Substandard'];
const LABS=[
  'State Ayurvedic Drug Testing Laboratory, Haridwar',
  'M/s Devansh Testing & Research Laboratory Ltd., Lakeshwari, Roorkee Haridwar.',
  'M/s Selqet Testing & Research Laboratory, Roorkee, Haridwar',
  'M/s Patanjali Research Foundation, Haridwar',
  'M/s Multani Pharmaceuticals Ltd. Testing Laboratory, Delhi',
  'M/s Sanskar Testing & Research Laboratory, Haridwar',
  'IMPCL Laboratory, Mohan (Almora)'
];
const FYS=['2022-23','2023-24','2024-25','2025-26','2026-27'];
const DI_FILTERS=[
  {label:'All Entries',value:''},
  {label:'DI — Udham Singh Nagar',value:'Udham Singh Nagar'},
  {label:'DI — Tehri',value:'Tehri'},
  {label:'DI — Pauri',value:'Pauri'},
  {label:'DI — Nainital',value:'Nainital'},
  {label:'DI — Almora',value:'Almora'},
  {label:'DI — Pithoragarh',value:'Pithoragarh'},
  {label:'DI — Champawat',value:'Champawat'},
  {label:'DI — Haridwar',value:'Haridwar'},
  {label:'DI — Uttarkashi',value:'Uttarkashi'},
  {label:'DI — Rudraprayag',value:'Rudraprayag'},
  {label:'DI — Chamoli',value:'Chamoli'},
  {label:'DI — Bageshwar',value:'Bageshwar'},
  {label:'DI — Dehradun',value:'Dehradun'},
  {label:'ADC (State Level)',value:'All'},
];

// ── State ─────────────────────────────────────────────────────────────────────
let S = {
  user: null, page: 'dashboard',
  samples: [], samplesLoaded: false,
  modal: null, activeSample: null,
  fSearch:'', fFY:'', fTab:'all', fDI:'',
  sortCol:'date_of_sampling', sortDir:-1,
  alert: null, loginErr: null,
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function today(){ return new Date().toISOString().split('T')[0]; }
function g(id){ return (document.getElementById(id)||{}).value||''; }
function loader(show){ document.getElementById('loader').style.display = show?'flex':'none'; }

function statusBadge(s){
  const m={Sent:'b-sent',Reported:'b-sq',Draft:'b-draft'};
  return `<span class="badge ${m[s]||'b-draft'}">${s||'Draft'}</span>`;
}
function findingBadge(f){
  if(!f||f==='Pending') return `<span class="badge b-pending">Pending</span>`;
  if(f==='Standard Quality') return `<span class="badge b-sq">✅ Standard</span>`;
  if(f==='Not of Standard Quality') return `<span class="badge b-nsq">❌ Not Standard</span>`;
  return `<span class="badge b-draft">${f}</span>`;
}
function shortLab(l){
  if(!l) return '';
  return l.replace('State Ayurvedic Drug Testing Laboratory, Haridwar','State DTL')
    .replace('M/s Devansh Testing & Research Laboratory Ltd., Lakeshwari, Roorkee Haridwar.','Devansh Lab')
    .replace('M/s Selqet Testing & Research Laboratory, Roorkee, Haridwar','Selqet Lab')
    .replace('M/s Patanjali Research Foundation, Haridwar','Patanjali Lab')
    .replace('M/s Multani Pharmaceuticals Ltd. Testing Laboratory, Delhi','Multani Lab')
    .replace('M/s Sanskar Testing & Research Laboratory, Haridwar','Sanskar Lab')
    .replace('IMPCL Laboratory, Mohan (Almora)','IMPCL Lab');
}
function canManage(s){
  const r=S.user.role;
  if(r==='admin'||r==='adc') return true;
  return r==='di' && s.district===S.user.district;
}
function genSerial(district,fy,role){
  const pfx=role==='adc'?'ADC-UK':`DI-${DIST_CODE[district]||'UK'}`;
  const n=S.samples.filter(x=>x.regulatory_serial&&x.regulatory_serial.startsWith(pfx)&&x.financial_year===fy).length+1;
  return `${pfx}-${String(n).padStart(4,'0')}/${fy}`;
}

function filteredSamples(){
  let s=[...S.samples];
  const r=S.user.role;
  if(r==='di') s=s.filter(x=>x.district===S.user.district);
  if(S.fDI && (r==='adc'||r==='admin')) s=s.filter(x=>x.district===S.fDI);
  if(S.fFY) s=s.filter(x=>x.financial_year===S.fFY);
  if(S.fSearch){
    const q=S.fSearch.toLowerCase();
    s=s.filter(x=>
      (x.sample_name||'').toLowerCase().includes(q)||
      (x.regulatory_serial||'').toLowerCase().includes(q)||
      (x.manufacturer_name||'').toLowerCase().includes(q)||
      (x.batch_number||'').toLowerCase().includes(q)||
      (x.lot_number||'').toLowerCase().includes(q)
    );
  }
  if(S.fTab==='sent')     s=s.filter(x=>x.workflow_status==='Sent');
  if(S.fTab==='reported') s=s.filter(x=>x.workflow_status==='Reported');
  if(S.fTab==='sq')  s=s.filter(x=>x.analytical_finding==='Standard Quality');
  if(S.fTab==='nsq') s=s.filter(x=>x.analytical_finding==='Not of Standard Quality');
  const col=S.sortCol, dir=S.sortDir;
  s.sort((a,b)=>{
    const av=String(a[col]||'').toLowerCase(), bv=String(b[col]||'').toLowerCase();
    return av<bv?-dir:av>bv?dir:0;
  });
  return s;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(S.page==='public'){app.innerHTML=renderPublic();bindPublic();return;}
  if(!S.user){app.innerHTML=renderLogin();bindLogin();return;}
  app.innerHTML=`${renderHeader()}<div class="layout">${renderSidebar()}<main class="main">${S.alert?renderAlert():''}<div id="page-content">${renderPage()}</div></main></div>${S.modal?renderModal():''}`;
  bindAll();
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
  <div class="login-logo"><div class="icon">🧪</div><h1>Drug Sample Registry</h1><p>Uttarakhand AYUSH — Drug Control Section</p></div>
  ${S.loginErr?`<div class="login-err">⚠️ ${S.loginErr}</div>`:''}
  <div class="fg"><label>Username</label><input type="text" id="lu" placeholder="e.g. di.usnagar / adc"></div>
  <div class="fg"><label>Password</label><input type="password" id="lp" placeholder="Password"></div>
  <button class="btn btn-green" style="width:100%;margin-top:10px;padding:10px;" id="lbtn">Login →</button>
  <div style="margin-top:14px;padding:10px;background:#f4f7fb;border-radius:7px;font-size:11px;color:#6b7a8d;">
    <strong>Drug Inspector usernames:</strong><br>
    di.usnagar · di.tehri · di.pauri · di.nainital · di.almora<br>
    di.pithoragarh · di.champawat · di.haridwar · di.uttarkashi<br>
    di.rudraprayag · di.chamoli · di.bageshwar · di.dehradun<br>
    <strong>ADC:</strong> adc &nbsp;|&nbsp; <strong>Admin:</strong> admin
  </div>
  <div style="margin-top:10px;text-align:center;">
    <button id="btn-public" style="background:none;border:none;color:var(--green);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;">🔍 Public Drug Testing Reports</button>
  </div>
</div></div>`;
}

function bindLogin(){
  document.getElementById('lbtn').onclick=doLogin;
  document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')doLogin();};
  const pb=document.getElementById('btn-public');
  if(pb) pb.onclick=()=>{S.page='public';render();};
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  if(!u||!p){S.loginErr='Username aur password dono bharo.';render();bindLogin();return;}
  loader(true);
  try{
    const rows=await sbSelect('users',`username=eq.${encodeURIComponent(u)}&select=*`);
    if(!rows||rows.length===0){S.loginErr='Username nahi mila.';loader(false);render();bindLogin();return;}
    const usr=rows[0];
    if(usr.password!==p){S.loginErr='Password galat hai.';loader(false);render();bindLogin();return;}
    S.user=usr;
    S.loginErr=null;
    await loadSamples();
    loader(false);
    render();
  }catch(e){
    S.loginErr='Server error: '+e.message;
    loader(false);render();bindLogin();
  }
}

// ── LOAD SAMPLES ─────────────────────────────────────────────────────────────
async function loadSamples(){
  try{
    // Load all samples ordered by date desc
    const rows = await sbSelect('samples','select=*&order=date_of_sampling.desc,created_at.desc&limit=2000');
    S.samples = rows || [];
    S.samplesLoaded = true;
  }catch(e){
    console.error('Load samples error:',e);
    S.samples=[];
  }
}

function bindFormConditional(pfx){
  const st=document.getElementById(`${pfx}_stype`);
  if(!st) return;
  const sn=document.getElementById(`${pfx}_sname`);
  const mn=document.getElementById(`${pfx}_mname`);
  if(sn&&mn) sn.addEventListener('input',()=>{mn.value=sn.value;});
  function toggle(){
    const isMed=st.value==='Medicine';
    ['cat','batch','mfgdate','exp'].forEach(r=>{const el=document.getElementById(`${pfx}_${r}_row`);if(el)el.style.display=isMed?'':'none';});
    ['lot','coldate'].forEach(r=>{const el=document.getElementById(`${pfx}_${r}_row`);if(el)el.style.display=isMed?'none':'';});
  }
  st.addEventListener('change',toggle);
}

function collectForm(pfx){
  const fy=g(`${pfx}_fy`), dist=g(`${pfx}_dist`);
  const stype=g(`${pfx}_stype`), isMed=stype==='Medicine';
  const sname=g(`${pfx}_sname`);
  return {
    financial_year:fy, district:dist, sample_name:sname, medicine_name:sname,
    sample_type:stype, sample_category:isMed?g(`${pfx}_scat`):'',
    enrolment_protocol:g(`${pfx}_ep`), inspector:g(`${pfx}_insp`)||S.user.name,
    date_of_sampling:g(`${pfx}_dos`), collection_source:g(`${pfx}_csrc`),
    collection_details:g(`${pfx}_cdet`), manufacturer_name:g(`${pfx}_mfgname`),
    license_number:g(`${pfx}_lic`)||'N/A',
    batch_number:isMed?g(`${pfx}_batch`):'', lot_number:!isMed?g(`${pfx}_lot`):'',
    mfg_date:isMed?g(`${pfx}_mfgdate`):'', expiry_date:isMed?g(`${pfx}_exp`):'',
    collection_date:!isMed?g(`${pfx}_coldate`):'',
    unit_quantity:g(`${pfx}_uqty`), dosage_form:g(`${pfx}_dosf`),
    order_number:g(`${pfx}_ordnum`)||'N/A', order_date:g(`${pfx}_orddate`)||'N/A',
    inspector_suspicion:g(`${pfx}_susp`), target_laboratory:g(`${pfx}_lab`),
    name_disclosed:g(`${pfx}_namedis`)||'N/A', sample_owner:g(`${pfx}_owner`),

}

// ── CSV DOWNLOAD ──────────────────────────────────────────────────────────────
function downloadCSV(){
  const list=filteredSamples();
  const HEADERS=['Regulatory Serial','Financial Year','Drug/Sample Name','Sample Type',
    'Sample Category','Enrolment Protocol','Inspector','District','Date of Sampling',
    'Collection Source','Collection Details','Manufacturer Name','License Number',
    'Batch Number','Lot Number','Mfg. Date','Expiry Date','Purchase/Collection Date',
    'Unit Quantity','Dosage Form','Order Number','Order Date','Inspector Suspicion',
    'Target Laboratory','Workflow Status','Lab Date Received','Lab Date Reported',
    'Analytical Finding','Name Disclosed 33KA','Sample Owner'];
  const FIELDS=['regulatory_serial','financial_year','sample_name','sample_type',
    'sample_category','enrolment_protocol','inspector','district','date_of_sampling',
    'collection_source','collection_details','manufacturer_name','license_number',
    'batch_number','lot_number','mfg_date','expiry_date','collection_date',
    'unit_quantity','dosage_form','order_number','order_date','inspector_suspicion',
    'target_laboratory','workflow_status','lab_date_received','lab_date_reported',
    'analytical_finding','name_disclosed','sample_owner'];
  const esc=v=>{const s=String(v==null?'':v).replace(/"/g,'""');return (s.includes(',')||s.includes('"')||s.includes('\n'))?`"${s}"`:s;};
  const rows=[HEADERS.map(esc).join(',')];
  list.forEach(x=>rows.push(FIELDS.map(f=>esc(x[f]||'')).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const ts=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const tab={all:'All',sent:'Sent',reported:'Reported',sq:'SQ',nsq:'NSQ'}[S.fTab]||'All';
  a.download=`DrugSamples_${tab}_${ts}.csv`;a.click();URL.revokeObjectURL(url);
}

// ── BIND ALL ──────────────────────────────────────────────────────────────────
function bindAll(){
  // Logout
  const lo=document.getElementById('logout');
  if(lo) lo.onclick=()=>{S.user=null;S.page='dashboard';S.samples=[];S.samplesLoaded=false;render();};
  // User menu
  const umBtn=document.getElementById('usermenu-btn');
  const umDrop=document.getElementById('usermenu-drop');
  if(umBtn&&umDrop){
    umBtn.onclick=e=>{e.stopPropagation();umDrop.style.display=umDrop.style.display==='none'?'block':'none';};

  }

  document.querySelectorAll('[data-pg]').forEach(el=>el.onclick=()=>{S.page=el.dataset.pg;render();});
  document.querySelectorAll('[data-act="new"]').forEach(el=>el.onclick=()=>{S.page='new';render();});

  const cm=()=>{S.modal=null;S.activeSample=null;render();};
  document.querySelectorAll('#mcl,#mcl2').forEach(b=>{if(b)b.onclick=cm;});

  const gr=document.getElementById('go-report');if(gr)gr.onclick=()=>{if(S.activeSample.workflow_status==='Sent'){S.modal='report';render();}};
  const gv=document.getElementById('go-view');if(gv)gv.onclick=()=>{S.modal='view';render();};
  // Form conditionals
  bindFormConditional('np');bindFormConditional('em');

  const cpbtn=document.getElementById('btn-changepwd');if(cpbtn)cpbtn.onclick=()=>{S.modal='changepwd';render();};

// ── SAVE ACTIONS (Supabase) ───────────────────────────────────────────────────
async function saveNewSample(){
  const d=collectForm('np');
  if(!d.sample_name){S.alert={type:'err',msg:'Sample Name zaroori hai.'};render();return;}
  if(d.sample_type==='Medicine'&&!d.batch_number){S.alert={type:'err',msg:'Medicine ke liye Batch Number zaroori hai.'};render();return;}
  loader(true);
  try{
    const serial=genSerial(d.district,d.financial_year,S.user.role);
    const newRow={id:'s_'+Date.now(), regulatory_serial:serial,
      workflow_status:'Sent', lab_date_received:'', lab_date_reported:'N/A',
      analytical_finding:'Pending', ...d};
    await sbInsert('samples', newRow);
    S.samples.unshift(newRow);
    S.alert={type:'ok',msg:`✅ Sample "${d.sample_name}" saved. Serial: ${serial}`};
    S.page='samples';
  }catch(e){S.alert={type:'err',msg:'Save failed: '+e.message};}
  loader(false);render();
}

async function saveEditSample(){
  const d=collectForm('em');
  if(!d.sample_name){S.alert={type:'err',msg:'Sample Name zaroori hai.'};render();return;}
  loader(true);
  try{
    await sbUpdate('samples',`id=eq.${S.activeSample.id}`,d);
    S.samples=S.samples.map(x=>x.id===S.activeSample.id?{...x,...d}:x);
    S.modal=null;S.activeSample=null;
    S.alert={type:'ok',msg:'✅ Sample details save ho gaye.'};
  }catch(e){S.alert={type:'err',msg:'Update failed: '+e.message};}
  loader(false);render();
}

async function saveReport(){
  const recv=g('rpt_recv'), date=g('rpt_date'), finding=g('rpt_finding');
  if(!date||!finding){S.alert={type:'err',msg:'Date aur Finding dono required hain.'};render();return;}
  loader(true);
  try{
    const upd={workflow_status:'Reported',lab_date_received:recv||'',lab_date_reported:date,analytical_finding:finding};
    await sbUpdate('samples',`id=eq.${S.activeSample.id}`,upd);
    S.samples=S.samples.map(x=>x.id===S.activeSample.id?{...x,...upd}:x);
    const nm=S.activeSample.sample_name;S.modal=null;S.activeSample=null;
    S.alert={type:'ok',msg:`✅ Report saved: "${nm}" → ${finding}`};
  }catch(e){S.alert={type:'err',msg:'Save failed: '+e.message};}
  loader(false);render();
}

async function savePassword(){
  const oldp=g('cp_old'),newp=g('cp_new'),conf=g('cp_conf');
  const errEl=document.getElementById('cp_err');
  const showErr=msg=>{errEl.style.display='block';errEl.textContent=msg;};
  errEl.style.display='none';
  if(oldp!==S.user.password){showErr('Current password galat hai.');return;}
  if(newp.length<6){showErr('New password kam se kam 6 characters ka hona chahiye.');return;}
  if(newp!==conf){showErr('New password aur confirm password match nahi kar rahe.');return;}
  loader(true);
  try{
    await sbUpdate('users',`id=eq.${S.user.id}`,{password:newp});
    S.user={...S.user,password:newp};
    S.modal=null;S.alert={type:'ok',msg:'✅ Password successfully change ho gaya.'};
  }catch(e){S.alert={type:'err',msg:'Password update failed: '+e.message};}
  loader(false);render();
}

async function saveProfile(){
  const newName=(document.getElementById('ep_name')||{}).value||'';
  const newDist=S.user.role==='di'?((document.getElementById('ep_dist')||{}).value||S.user.district):S.user.district;
  if(!newName.trim()){S.alert={type:'err',msg:'Naam khali nahi ho sakta.'};render();return;}
  loader(true);
  try{
    await sbUpdate('users',`id=eq.${S.user.id}`,{name:newName.trim(),district:newDist});
    S.user={...S.user,name:newName.trim(),district:newDist};
    S.modal=null;S.alert={type:'ok',msg:'✅ Profile update ho gaya. Purane samples unchanged hain.'};
  }catch(e){S.alert={type:'err',msg:'Profile update failed: '+e.message};}
  loader(false);render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  // Load reported samples for public view even before login
  try{
    const rows=await sbSelect('samples','select=*&order=date_of_sampling.desc,created_at.desc&limit=2000');
    S.samples=rows||[];
    S.samplesLoaded=true;
  }catch(e){console.log('Init samples load:',e.message);}
  loader(false);
  render();
}

init();
</script>
